<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icons.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Picky — a compact color picker to preview, select, and copy web colors with suggestions and HEX support."
    />
    <meta
      name="keywords"
      content="color picker, hex, rgb, web colors, color suggestions, color preview"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://duebenpresleylewis.github.io/picky/" />
    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph -->
    <meta property="og:title" content="Picky — Color Picker" />
    <meta
      property="og:description"
      content="Preview and pick web colors quickly; copy HEX values and explore suggested colors."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://duebenpresleylewis.github.io/picky/"
    />
    <meta property="og:image" content="/icons.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Picky — Color Picker" />
    <meta
      name="twitter:description"
      content="Preview and pick web colors quickly; copy HEX values and explore suggested colors."
    />
    <meta name="twitter:image" content="/icons.svg" />

    <title>Picky</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Picky",
        "url": "https://duebenpresleylewis.github.io/picky/",
        "description": "A compact color picker to preview, select, and copy web colors.",
        "publisher": {
          "@type": "Organization",
          "name": "Dueben Presley Lewis",
          "url": "https://github.com/duebenpresleylewis"
        }
      }
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="bg-emerald-500 transition-colors">
    <header class="bg-emerald-900 p-4 flex justify-between items-center">
      <h1 class="text-4xl font-bold text-white">Picky</h1>
      <a
        href="https://github.com/duebenpresleylewis"
        class="fa-brands fa-github block text-3xl text-amber-50 pr-6 hover:text-gray-200"
        target="_blank"
      ></a>
    </header>

    <!-- Modal -->
    <div
      id="myModal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      aria-describedby="modalMessage"
    >
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2 id="modalTitle">Notification</h2>
        <p id="modalMessage">This is your modal notification message!</p>
      </div>
    </div>

    <!-- loader -->
    <div class="loading-overlay">
      <div class="loader"></div>
    </div>

    <main
      id="main-container"
      class="flex flex-col justify-center items-center p-4"
    >
      <div
        class="search-container bg-green-200 p-5 flex justify-between items-center shadow-2xl rounded-2xl"
      >
        <form
          action=""
          class="flex flex-col justify-center items-center gap-4.5"
        >
          <label for="user-input" name="usercolor"
            >Enter a color name or a hex value:</label
          >

          <div>
            <input
              type="text"
              placeholder="Ex: blue or #f5f5f5"
              id="user-input"
              class="bg-green-400 rounded-xl py-0.5 px-1"
            />

            <div id="suggestions" role="listbox" aria-expanded="false"></div>
          </div>

          <input
            id="color-input"
            type="color"
            title="color picker"
            class="inline-block rounded-full cursor-pointer bg-emerald-400 px-1 py-1"
          />

          <button
            type="button"
            id="preview-btn"
            class="bg-green-950 text-green-100 py-2 px-3 rounded-full font-bold cursor-pointer hover:bg-emerald-800 focus:outline-2 focus:outline-offset-2 focus:outline-emerald-800 active:bg-emerald-700 transition-colors"
          >
            Preview
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
